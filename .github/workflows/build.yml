name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Debug-APK bauen
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk hey-claude.apk

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Hey Claude – Build ${{ github.run_number }}
          body: |
            Automatisch gebaut aus ${{ github.sha }}.
            Direkter Download der neuesten Version:
            https://github.com/${{ github.repository }}/releases/latest/download/hey-claude.apk
          files: hey-claude.apk
          make_latest: "true"
